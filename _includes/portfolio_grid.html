<!-- Portfolio Grid Section -->
<style>
  .pricing-card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.07);
    margin-bottom: 28px;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .pricing-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 14px 45px rgba(0,0,0,0.13);
  }
  .pricing-card-header {
    background: var(--cc);
    padding: 28px 20px 22px;
    text-align: center;
  }
  .pricing-card-header .pc-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    margin-bottom: 12px;
  }
  .pricing-card-header h4 {
    color: #fff;
    font-size: 1.25em;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    letter-spacing: 1px;
  }
  .pricing-card-price {
    text-align: center;
    padding: 20px 20px 16px;
    border-bottom: 1px solid #f0f0f0;
  }
  .price-amount {
    font-size: 2.6em;
    font-weight: 700;
    color: var(--cc);
    line-height: 1;
    font-family: 'Montserrat', sans-serif;
  }
  .price-label {
    font-size: 0.82em;
    color: #aaa;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .pricing-card-features {
    padding: 18px 24px;
    flex: 1;
  }
  .pricing-card-features ul {
    list-style: none;
    padding: 0; margin: 0;
  }
  .pricing-card-features ul li {
    padding: 8px 0;
    font-size: 0.9em;
    color: #555;
    border-bottom: 1px solid #f5f5f5;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pricing-card-features ul li:last-child { border-bottom: none; }
  .pricing-card-features ul li::before {
    content: '✓';
    color: var(--cc);
    font-weight: 700;
    flex-shrink: 0;
  }
  .pricing-card-footer {
    padding: 16px 20px 22px;
    text-align: center;
  }
  .pricing-btn {
    display: block;
    background: var(--cc);
    color: #fff !important;
    padding: 12px 20px;
    border-radius: 5px;
    font-weight: 700;
    font-size: 0.88em;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none !important;
    transition: opacity 0.2s ease;
    font-family: 'Montserrat', sans-serif;
  }
  .pricing-btn:hover { opacity: 0.82; }
</style>

<section id="portfolio">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading" data-ka="კურსების გალერეა" data-en="Course Gallery">კურსების გალერეა</h2>
                <h3 class="section-subheading text-muted" data-ka="გთავაზობთ მათემატიკის კურსების ჩამონათვალს." data-en="Explore our mathematics course offerings.">გთავაზობთ მათემატიკის კურსების ჩამონათვალს.</h3>
            </div>
        </div>
        <div class="row">
        {% assign lang = "en" %}
        {% for post in site.posts %}
            <div class="col-md-4 col-sm-6">
                <div class="pricing-card" style="--cc: {{ post.course-color }};">
                    <div class="pricing-card-header">
                        <div class="pc-icon"><i class="fa {{ post.course-icon }}"></i></div>
                        <h4 data-ka="{{ post.title-ka }}" data-en="{{ post.title-en }}">{{ post.title }}</h4>
                    </div>
                    <div class="pricing-card-price">
                        <div class="price-amount">${{ post.price }}</div>
                        <div class="price-label" data-ka="გაკვეთილზე" data-en="per lesson">per lesson</div>
                    </div>
                    <div class="pricing-card-features">
                        <ul>
                        {% for feature in post.features-en %}
                            <li data-en="{{ feature }}"
                                data-ka="{{ post.features-ka[forloop.index0] }}">{{ feature }}</li>
                        {% endfor %}
                        </ul>
                    </div>
                    <div class="pricing-card-footer">
                        <a href="#contact" class="pricing-btn page-scroll"
                           data-ka="უფასო გაკვეთილი" data-en="Book Free Lesson">Book Free Lesson</a>
                    </div>
                </div>
            </div>
        {% endfor %}
        </div>
    </div>
</section>
